// DeckOps offline: local LAN multiplayer server for BO1, based on the DeckOps BO1 server's dedicated.cfg
set sv_hostname "DeckOps Offline"
// Private match: unranked, so nothing is checked against or written to ranked stats
set xblive_privatematch "1"
set g_inactivity "0"
set scr_kick_time "99999"
set scr_kick_mintime "99999"
set sv_timeout "60"
set sv_allowAimAssist "1"
set scr_allowFileIo "1"
set scr_kill_infinite_loops "1"
set sv_wwwBaseURL ""
set scr_teambalance "1"
set logfile 1
set g_gametype "tdm"
set sv_maprotation "gametype tdm map mp_array map mp_cracked map mp_crisis map mp_firingrange map mp_duga map mp_hanoi map mp_cairo map mp_havoc map mp_cosmodrome map mp_nuked map mp_radiation map mp_mountain map mp_villa map mp_russianbase"
// Bot Warfare T5: 9 bots + the player, 5 against 5 like the stock lobbies (fill counts the player)
set bots_main "1"
set bots_main_firstIsHost "0"
set bots_main_kickBotsAtEnd "0"
set bots_manage_fill "10"
set bots_manage_fill_kick "1"
set bots_manage_fill_spec "1"
set bots_manage_fill_mode "0"
set bots_team "autoassign"
set bots_team_force "1"
// BO1 bots use Combat Training's difficulty words: easy, normal, hard, fu
set bots_skill "normal"
set bots_loadout_reasonable "1"
set bots_loadout_allow_op "0"
set bots_play_obj "1"
set bots_play_nade "1"
set bots_play_take_carepackages "1"
set bots_play_killstreak "1"
