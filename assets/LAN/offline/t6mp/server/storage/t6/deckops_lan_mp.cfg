// DeckOps offline: local LAN multiplayer server, based on the DeckOps BO2 MP server config
sv_maxclients 13
demo_enabled 0
sv_hostname "DeckOps Offline"
sv_motd ""
sv_allowAimAssist 1
sv_replaceBots 1
set scr_teambalance "1"
seta sv_wwwBaseURL ""
rcon_localhost_bypass 1
set g_inactivity "0"
set scr_kick_time "99999"
set scr_kick_mintime "99999"
set bots_main "1"
set bots_main_firstIsHost "0"
set bots_main_waitForHostTime "0"
set bots_main_kickBotsAtEnd "0"
set bots_main_menu "0"
set bots_main_chat "0"
set bots_manage_add "0"
set bots_manage_fill "10"
set bots_manage_fill_mode "0"
set bots_manage_fill_kick "1"
set bots_manage_fill_spec "1"
set bots_skill "2"
set bots_loadout_reasonable "1"
set bots_loadout_allow_op "0"
set bots_play_obj "1"
sv_maprotation "execgts tdm.cfg map mp_nuketown_2020"
